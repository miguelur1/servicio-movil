name: build-and-release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run fetch-tools
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      # Cada push a main publica la Release v<versión de package.json> (crea la etiqueta).
      # Si esa versión ya está publicada, electron-builder no la sobrescribe: para sacar
      # una actualización basta con subir "version" en package.json.
      - name: Publicar release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx electron-builder --win nsis --publish always
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Compilar instalador (sin publicar)
        if: github.event_name == 'pull_request'
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.exe
