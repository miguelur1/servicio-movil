name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run fetch-tools
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      # En una etiqueta vX.Y.Z se publica la Release; la app instalada se actualiza sola desde ella.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --publish always
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Compilar instalador (sin publicar)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.exe
