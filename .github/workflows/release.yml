name: build-and-release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/fetch-tools.js --skip-ios
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Empaquetar libimobiledevice (MSYS2, compatible con iOS recientes)
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env: { CHERE_INVOKING: '1', MSYSTEM: UCRT64 }
        run: scripts/bundle-libimobiledevice.sh
      - name: Probar que las herramientas arrancan
        shell: bash
        run: |
          resources/bin/platform-tools/adb.exe version
          resources/bin/scrcpy/scrcpy.exe --version
          test -f resources/bin/google-usb-driver/android_winusb.inf && grep -c "18D1" resources/bin/google-usb-driver/android_winusb.inf
          resources/bin/libimobiledevice/idevice_id.exe --version
          resources/bin/libimobiledevice/idevicebackup2.exe --version
          resources/bin/libimobiledevice/ideviceinstaller.exe --version || resources/bin/libimobiledevice/ideviceinstaller.exe --help | head -5
          resources/bin/libimobiledevice/idevice_id.exe -l || true
      # Cada push a main publica la Release v<versión de package.json>.
      # Se compila sin publicar y se sube con gh: electron-builder sube los archivos en paralelo
      # y cada subida intentaba crear la release a la vez (422 "Published releases must have a valid tag").
      # Re-ejecutar es seguro: si la release ya existe, se reemplazan sus archivos (--clobber).
      # Para sacar una actualización basta con subir "version" en package.json.
      - name: Publicar release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          npx electron-builder --win nsis --publish never
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "Servicio Móvil $TAG"
          gh release upload "$TAG" dist/*.exe dist/*.exe.blockmap dist/latest.yml --clobber
      - name: Compilar instalador (sin publicar)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          npx electron-builder --win nsis --publish never
          # La auto-actualización necesita latest.yml junto al .exe en la release.
          ls dist/*.exe dist/*.exe.blockmap dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.exe
